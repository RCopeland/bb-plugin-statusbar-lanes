name: CI

# Runs on every push and every PR, INCLUDING pushes to main.
#
# WHY main IS NOT EXCLUDED (unlike the other bb plugin repos)
#
# Those repos exclude main because a merge triggers a publish workflow, and CI
# on main would be redundant. This repo has no publish workflow and no other
# gate, so excluding main would mean the default branch is the ONE branch that
# is never verified.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repo. Declaring it explicitly
# means a compromised dependency in the build cannot use the default token to
# write back to the repository.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version BB 0.44 bundles, so a type or runtime
          # difference between CI and a real BB host shows up here.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # The artifact is the real deliverable. A plugin can typecheck and still fail
  # `bb plugin build` (a bad bb.* manifest path, a missing entry file), and that
  # failure would otherwise only surface when someone tried to install it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install the BB CLI
        run: npm install --global bb-app@0.44.0

      - name: Build the plugin
        run: bb plugin build

      - name: Assert build artifacts exist
        run: |
          set -euo pipefail
          for f in dist/server.js dist/server.meta.json; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
            echo "ok: $f"
          done

      # A wrong plugin id is a silent misroute: the section would never be
      # discovered, and nothing would report an error.
      - name: Assert the manifest declares the expected plugin id
        run: |
          set -euo pipefail
          node -e '
            const meta = require("./dist/server.meta.json");
            const want = "statusbar-lanes";
            if (meta.pluginId !== want) {
              console.error(`pluginId is ${meta.pluginId}, expected ${want}`);
              process.exit(1);
            }
            console.log(`ok: pluginId=${meta.pluginId} sdk=${meta.sdkVersion}`);
          '

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the full history, not just the tip: a secret that was committed
          # and later deleted is still leaked, and still rotatable.
          fetch-depth: 0

      - name: Scan tracked files for secrets and credential paths
        run: ./scripts/check-secrets.sh

      - name: Scan the full history for known credential formats
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::error::known credential format in git history: $line"
            found=1
          done < <(git log -p --all -S'sk-or-v1-' --oneline \
            | grep -E '^\+.*sk-or-v1-[0-9a-fA-F]{32,}' || true)
          if [ "$found" -ne 0 ]; then
            echo "A credential appears in history. Rotate it." >&2
            exit 1
          fi
          echo "ok: no OpenRouter key format found in history"

  # This plugin's contract is narrow and worth asserting: it must publish the
  # section method as DISCOVERABLE (without that flag the bar cannot find it and
  # the section silently never appears), and it must not start fetching lane data
  # itself, which is the duplication the whole design exists to avoid.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the section method is registered as discoverable
        run: |
          set -euo pipefail
          if ! grep -q 'experimental_discoverable: true' src/server.ts; then
            echo "src/server.ts must register with experimental_discoverable: true" >&2
            echo "Without it the bar cannot discover this provider." >&2
            exit 1
          fi
          echo "ok: experimental_discoverable is set"

      - name: Assert the plugin reads lanes over RPC rather than fetching directly
        run: |
          set -euo pipefail
          fail=0

          # It must call the lanes plugin.
          if ! grep -q 'callRpc' src/server.ts; then
            echo "src/server.ts must call the lanes plugin over RPC" >&2
            fail=1
          fi

          # It must NOT re-implement lanes' data collection. These are the
          # sources bb-plugin-lanes owns; reaching for them here would recreate
          # the drift the split was meant to remove.
          #
          # Comments are stripped first. The source explains at length WHY it
          # delegates instead of fetching, so scanning raw text matches that
          # prose and fails on the plugin's own documentation. Only real code
          # lines count.
          #
          # The strip is deliberately crude (it does not understand `//` inside
          # a string literal) because the failure mode of a missed comment is a
          # false PASS on prose, not a false FAIL on real code.
          strip_comments() {
            sed -e 's://.*::' "$@"
          }

          hits=0
          for file in src/*.ts; do
            [ -e "$file" ] || continue
            while IFS= read -r line; do
              echo "$file: $line" >&2
              hits=1
            done < <(strip_comments "$file" \
              | grep -nE 'usageLimits|openrouter\.ai|OPENROUTER_API_KEY|env\.json' || true)
          done

          if [ "$hits" -ne 0 ]; then
            echo "src/ must not read lane sources directly - delegate to the lanes plugin" >&2
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "ok: lanes data comes from the lanes plugin, not re-derived here"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no native build step is introduced
        run: |
          set -euo pipefail
          # This plugin needs no native module: it makes one RPC call and does no
          # local I/O. A native dependency would add a build toolchain to every
          # host that installs it.
          if grep -qE '"better-sqlite3"' package.json && \
             ! grep -q '"//devDependencies"' package.json; then
            echo "better-sqlite3 must not be a runtime dependency" >&2
            exit 1
          fi
          echo "ok: no native runtime dependency"

      - name: Assert the plugin ships a server entry point
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./package.json");
            if (!pkg.bb || !pkg.bb.server) {
              console.error("package.json bb.server is missing");
              process.exit(1);
            }
            console.log(`ok: bb.server=${pkg.bb.server}`);
          '
